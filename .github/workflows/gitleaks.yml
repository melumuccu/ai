name: gitleaks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: [self-hosted, ai]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove stale gitleaks download temp
        run: rm -f "$TMPDIR/gitleaks.tmp"
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
