name: external-skills-sync

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, ai]
    steps:
      - uses: actions/checkout@v6
      - name: Test sync script
        run: mise run test-sync-external-skills
      - name: Check lock, publish dir, and marketplace skills
        run: mise run sync-external-skills-check
