repos:
  - repo: local
    hooks:
      - id: sync-external-skills
        name: Sync lock-tracked skills to publish dir
        entry: node scripts/sync-external-skills.mjs --apply --stage
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: gitleaks-pre-commit
        name: Detect hardcoded secrets
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: gitleaks-pre-push
        name: Detect hardcoded secrets (push)
        entry: gitleaks git --redact --verbose
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
