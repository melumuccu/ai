<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>修正前 — スクリーンショット比較デモ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 3rem;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      color: #1e40af;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      color: #475569;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .cta {
      display: inline-block;
      background: #ea580c;
      color: #fff;
      padding: 0.875rem 2rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>ようこそ</h1>
    <p>修正前のデモページです。見出しは青系、CTA はオレンジです。</p>
    <a class="cta" href="#">はじめる</a>
  </main>
</body>
</html>
